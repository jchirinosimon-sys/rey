services:
  - type: web
    name: rey
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --omit=dev
    startCommand: npm run init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_DRIVER
        value: mongo
      - key: MONGODB_DB
        value: asistencia
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
